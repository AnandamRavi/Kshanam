<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation preview</title>
<link rel="stylesheet" href="style.css?v=4"><link rel="stylesheet" href="invite.css?v=1">
</head><body>
<div class="wrap" style="padding-top:24px">
  <p><strong>Invitation preview.</strong> Tick the events a guest is invited to. Edit the Settings / Events / Party tabs, then refresh to see changes.</p>
  <div id="picker" style="margin:12px 0 20px"></div>
  <div id="invitation-embed" style="display:block"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script><script src="settings.js?v=3"></script><script src="invite.js?v=1"></script>
<script>
(async function () {
  const text = await (await fetch(CONFIG.EVENTS_CSV_URL, { cache: "no-store" })).text();
  const events = Papa.parse(text, { header: true, skipEmptyLines: true }).data.filter(e => e.ID);
  const picker = document.getElementById("picker");
  picker.innerHTML = events.map(e => `<label style="margin-right:16px"><input type="checkbox" value="${e.ID}" checked> ${e.Name || e.ID}</label>`).join("");
  async function draw() {
    const on = [...picker.querySelectorAll("input:checked")].map(i => i.value);
    const chosen = events.filter(e => on.includes(e.ID)).sort((a, b) => new Date(a.Date) - new Date(b.Date));
    renderGeneratedInvite({ container: document.getElementById("invitation-embed"), events: chosen, settings: await loadSettings() });
  }
  picker.addEventListener("change", draw);
  draw();
})();
</script></body></html>
