<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Raj &amp; Simran: Palat! The Maze</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf0dc;--ink:#3a1d12;--panel:#fff8ee;--red:#c21f34;--gold:#f3b31f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1410;--ink:#f6e8d2;--panel:#2b1e17}}
:root[data-theme="dark"]{--bg:#1d1410;--ink:#f6e8d2;--panel:#2b1e17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:500;line-height:1.3}
.wrap{max-width:560px;margin:0 auto;padding:8px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(1.15rem,4.5vw,1.6rem);text-align:center;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chips span{font-size:.82rem;padding:1px 9px;border:2px solid var(--gold);border-radius:99px;opacity:.5}
.chips span.on{opacity:1;background:var(--gold);color:#3a1d12;font-weight:700}
.stage{position:relative;width:min(100%,480px,calc((100vh - 200px)*.5));width:min(100%,480px,calc((100dvh - 200px)*.5));min-width:290px;aspect-ratio:1/2;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:#c5ec9a}
.stage:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
canvas#cv{width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;top:2%;transform:translateX(-50%);width:88%;padding:8px 14px;text-align:center;background:var(--gold);color:#3a1d12;border:3px solid #fff8ee;border-radius:16px;font-weight:700;font-size:clamp(.95rem,3.6vw,1.15rem);pointer-events:none;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast[hidden],.win[hidden]{display:none}
.win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;background:rgba(255,236,170,.94);color:#3a1d12;z-index:3}
.win h2{margin:0;color:var(--red);font-size:1.6rem;line-height:1.1}
.win p{margin:0 0 6px}
.bar{width:min(100%,480px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
#msg{margin:0;flex:1 1 220px;font-size:1rem}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:2px solid var(--red);border-radius:99px;padding:5px 14px;min-height:40px;cursor:pointer}
button.p,.win button{background:var(--red);color:#fff8ee}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Raj &amp; Simran: Palat! The Maze</h1>
  <div class="chips" id="chips"></div>
  <div class="stage" id="stage" tabindex="0" role="application" aria-label="Maze. Drag the couple or use arrow keys to travel from the Swiss meadow at the bottom to the mustard fields of Punjab at the top.">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="win" id="win" hidden>
      <canvas id="wc" width="240" height="130"></canvas>
      <h2>Raj &amp; Simran made it to Punjab!</h2>
      <p>Past the cows and cowbells, through the Alps, by Big Ben and the London Eye, and across the ocean. Palat!</p>
      <button id="again">Play again</button>
    </div>
  </div>
  <div class="bar">
    <p id="msg">Drag the couple (or use arrow keys) from Switzerland to Punjab.</p>
    <div class="btns"><button id="hint">Hint</button><button id="route">Show route</button><button id="new" class="p">New maze</button></div>
  </div>
</main>
<script>
(function(){
var C=12,R=24,B=4,N=40,S=2,W=C*N,H=R*N,dr=[-1,0,1,0],dc=[0,1,0,-1];
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=W*S;cv.height=H*S;
var bg=document.createElement('canvas');bg.width=W*S;bg.height=H*S;var b=bg.getContext('2d');
var $=function(i){return document.getElementById(i)};
var toast=$('toast'),msg=$('msg'),win=$('win'),stage=$('stage');
var seed,cells,end,pos,vx,vy,seen,routeOn=false,done=false,tt,lastBump=0;
var STOPS=[['Punjab','🌾'],['Flight','✈️'],['London','🎡'],['Train','🚆'],['Alps','🍫'],['Switzerland','🐄']];
var ENTER=['Punjab at last! Mustard fields as far as you can see. Palat!','Wheels up! The plane is crossing the ocean to India.','London! Wave to Big Ben and the London Eye.','All aboard! The train winds through the mountains towards the UK.','The Swiss Alps: snowy peaks and chocolate everywhere!','Switzerland: cows, cowbells and wildflowers. Ring ring!'];
var TIP=['Almost home. Find the way to the mustard fields.','Keep the plane heading over the waves.','Cross London past the clock tower.','Follow the tracks through the mountains.','Climb through the peaks, grab the chocolate.','Wander past the cows to the hills.'];
var EM=[['🌾','🌻','🚜','🏡'],['✈️','☁️','🌊','🐬'],['🚌','☔','🇬🇧','💂'],['🚆','🚂','⛰️','🚉'],['🍫','🏔️','⛷️','🧀'],['🐄','🔔','🌼','🐮']];
var COL=[['#ffe38a','#f5b83a'],['#8fd0ff','#3b86d6'],['#d6dce8','#9aa6bd'],['#ecdcc0','#bda57f'],['#bfe6ff','#eaf6ff'],['#c9ee9f','#7cc25a']];
var chips=$('chips');
STOPS.slice().reverse().forEach(function(s,i){var e=document.createElement('span');e.textContent=s[1]+' '+s[0];chips.appendChild(e)});
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function gen(){
  seed=(Math.random()*1e9)|0;cells=[];
  for(var r=0;r<R;r++){cells[r]=[];for(var c=0;c<C;c++)cells[r][c]=[1,1,1,1]}
  for(var k=0;k<6;k++){
    var r0=k*B,vis=[],sc=rnd()*C|0,s=[[r0,sc]];vis[r0*C+sc]=1;
    while(s.length){
      var p=s[s.length-1],o=[],d;
      for(d=0;d<4;d++){var a=p[0]+dr[d],e=p[1]+dc[d];if(a>=r0&&a<r0+B&&e>=0&&e<C&&!vis[a*C+e])o.push(d)}
      if(!o.length){s.pop();continue}
      d=o[rnd()*o.length|0];var nr=p[0]+dr[d],nc=p[1]+dc[d];
      cells[p[0]][p[1]][d]=0;cells[nr][nc][(d+2)%4]=0;vis[nr*C+nc]=1;s.push([nr,nc]);
    }
    if(k<5){var g=rnd()*C|0,rr=r0+B-1;cells[rr][g][2]=0;cells[rr+1][g][0]=0}
  }
  end=[0,rnd()*C|0];pos={r:R-1,c:rnd()*C|0};vx=pos.c*N+N/2;vy=pos.r*N+N/2;
  seen=[];seen[5]=1;done=false;routeOn=false;$('route').textContent='Show route';
  win.hidden=true;paint();chipsUpdate();say(ENTER[5]);
}
function chipsUpdate(){for(var i=0;i<6;i++)chips.children[i].className=seen[5-i]?'on':''}
function say(t){toast.textContent=t;toast.hidden=false;clearTimeout(tt);tt=setTimeout(function(){toast.hidden=true},3600)}
function tri(x,base,w,h,col){b.fillStyle=col;b.beginPath();b.moveTo(x-w,base);b.lineTo(x,base-h);b.lineTo(x+w,base);b.fill()}
function paint(){
  b.setTransform(S,0,0,S,0,0);b.clearRect(0,0,W,H);
  for(var k=0;k<6;k++){
    var y0=k*B*N,h=B*N,g=b.createLinearGradient(0,y0,0,y0+h);g.addColorStop(0,COL[k][0]);g.addColorStop(1,COL[k][1]);
    b.fillStyle=g;b.fillRect(0,y0,W,h);
    if(k==0){b.fillStyle='#fff3b0';b.beginPath();b.arc(410,y0+30,20,0,6.3);b.fill();b.strokeStyle='rgba(214,140,10,.5)';b.lineWidth=3;for(var i=0;i<9;i++){b.beginPath();b.moveTo(0,y0+84+i*9);b.lineTo(W,y0+84+i*9);b.stroke()}}
    if(k==1){b.fillStyle='#1b5fae';b.fillRect(0,y0+98,W,62);b.strokeStyle='rgba(255,255,255,.55)';b.lineWidth=2;for(var x=10;x<W;x+=34)for(var y=y0+110;y<y0+160;y+=18){b.beginPath();b.arc(x+(y%2?12:0),y,8,Math.PI*1.1,Math.PI*1.9);b.stroke()}
      b.fillStyle='rgba(255,255,255,.9)';[[80,30],[250,50],[400,25]].forEach(function(c){b.beginPath();b.ellipse(c[0],y0+c[1],38,13,0,0,6.3);b.ellipse(c[0]+22,y0+c[1]-8,22,12,0,0,6.3);b.fill()})}
    if(k==2){b.fillStyle='#c9a96a';b.fillRect(74,y0+50,32,110);b.fillRect(70,y0+30,40,20);tri(90,y0+30,18,26,'#8d7442');
      b.fillStyle='#fff';b.beginPath();b.arc(90,y0+62,10,0,6.3);b.fill();b.strokeStyle='#3a1d12';b.lineWidth=2;b.stroke();b.beginPath();b.moveTo(90,y0+62);b.lineTo(90,y0+55);b.moveTo(90,y0+62);b.lineTo(95,y0+64);b.stroke();
      var ex=370,ey=y0+80;b.strokeStyle='#fff';b.lineWidth=4;b.beginPath();b.arc(ex,ey,60,0,6.3);b.stroke();b.lineWidth=1.5;
      for(var i=0;i<12;i++){var an=i*Math.PI/6;b.beginPath();b.moveTo(ex,ey);b.lineTo(ex+Math.cos(an)*60,ey+Math.sin(an)*60);b.stroke();b.fillStyle='#3b86d6';b.beginPath();b.arc(ex+Math.cos(an)*60,ey+Math.sin(an)*60,4,0,6.3);b.fill()}
      b.lineWidth=4;b.beginPath();b.moveTo(ex,ey);b.lineTo(ex-26,y0+160);b.moveTo(ex,ey);b.lineTo(ex+26,y0+160);b.stroke()}
    if(k==3){tri(90,y0+110,110,70,'#a89479');tri(330,y0+110,140,85,'#a89479');b.strokeStyle='#5b4a38';b.lineWidth=3;b.beginPath();b.moveTo(0,y0+78);b.lineTo(W,y0+78);b.moveTo(0,y0+86);b.lineTo(W,y0+86);b.stroke();b.lineWidth=2;for(var x=0;x<W;x+=12){b.beginPath();b.moveTo(x,y0+75);b.lineTo(x,y0+89);b.stroke()}}
    if(k==4){[[40,110,75],[160,140,95],[290,100,80],[410,135,95]].forEach(function(m){tri(m[0],y0+160,m[2],m[1],'#8aa0bb');tri(m[0],y0+160-m[1]*.65,m[2]*.35,m[1]*.35,'#fff')})}
    if(k==5){b.fillStyle='#a6dd7a';b.beginPath();b.ellipse(100,y0+175,230,70,0,0,6.3);b.fill();b.fillStyle='#9ad06c';b.beginPath();b.ellipse(400,y0+185,210,60,0,0,6.3);b.fill()}
    b.font='24px "Apple Color Emoji","Segoe UI Emoji",sans-serif';b.textAlign='center';b.textBaseline='middle';
    for(var i=0;i<8;i++){b.fillText(EM[k][i%4],(Math.random()*C|0)*N+N/2,(k*B+(Math.random()*B|0))*N+N/2+2)}
  }
  b.beginPath();
  for(var r=0;r<R;r++)for(var c=0;c<C;c++){var x=c*N,y=r*N,w=cells[r][c];
    if(w[0]){b.moveTo(x,y);b.lineTo(x+N,y)}if(w[3]){b.moveTo(x,y);b.lineTo(x,y+N)}
    if(c==C-1&&w[1]){b.moveTo(x+N,y);b.lineTo(x+N,y+N)}if(r==R-1&&w[2]){b.moveTo(x,y+N);b.lineTo(x+N,y+N)}}
  b.lineCap='round';b.strokeStyle='rgba(255,255,255,.75)';b.lineWidth=7;b.stroke();b.strokeStyle='#3a1d12';b.lineWidth=4;b.stroke();
  b.font='34px "Apple Color Emoji","Segoe UI Emoji",sans-serif';b.fillText('🏡',end[1]*N+N/2,end[0]*N+N/2+2);
}
function heart(c,x,y,r){c.beginPath();c.moveTo(x,y+r*.95);c.bezierCurveTo(x-r*1.7,y-r*.1,x-r*.95,y-r*1.35,x,y-r*.45);c.bezierCurveTo(x+r*.95,y-r*1.35,x+r*1.7,y-r*.1,x,y+r*.95);c.closePath()}
function couple(c,x,y,k){
  c.save();c.translate(x,y);c.scale(k,k);
  function person(px,hair,body,long){
    if(long){c.fillStyle=hair;c.beginPath();c.ellipse(px,-1,8.5,13,0,0,6.3);c.fill()}
    c.fillStyle=body;c.beginPath();c.ellipse(px,11,7.5,7,0,0,6.3);c.fill();
    c.fillStyle='#f1c9a0';c.beginPath();c.arc(px,-4,6,0,6.3);c.fill();
    c.fillStyle=hair;c.beginPath();c.arc(px,-5,6.4,Math.PI,0);c.fill();
    if(!long){c.beginPath();c.arc(px+3,-11,3,0,6.3);c.fill()}
    c.fillStyle='#2a1a12';c.fillRect(px-3,-3,1.6,1.6);c.fillRect(px+1.5,-3,1.6,1.6)}
  person(-9,'#2a1a12','#7a4a2a',0);person(9,'#3b2418','#f3b31f',1);
  c.fillStyle='#fff';c.beginPath();c.moveTo(-12,6);c.lineTo(-6,6);c.lineTo(-9,12);c.fill();
  c.fillStyle='#c21f34';heart(c,0,-17,3.4);c.fill();c.restore();
}
function solve(){
  var from=pos.r*C+pos.c,prev={},q=[from];prev[from]=-1;
  while(q.length){var u=q.shift();if(u==end[0]*C+end[1])break;var r=u/C|0,c=u%C;
    for(var d=0;d<4;d++)if(!cells[r][c][d]){var v=(r+dr[d])*C+c+dc[d];if(!(v in prev)){prev[v]=u;q.push(v)}}}
  var p=[],u=end[0]*C+end[1];while(u!=-1&&u!==undefined){p.unshift([u/C|0,u%C]);u=prev[u]}return p;
}
function move(d){
  if(done)return false;
  if(cells[pos.r][pos.c][d]){var n=performance.now();if(n-lastBump>1500){lastBump=n;msg.textContent='A wall! Try another way.'}return false}
  pos.r+=dr[d];pos.c+=dc[d];var k=pos.r/B|0;
  if(!seen[k]){seen[k]=1;say(ENTER[k]);chipsUpdate()}
  if(pos.r==end[0]&&pos.c==end[1]){done=true;setTimeout(function(){win.hidden=false;var w=$('wc').getContext('2d');w.clearRect(0,0,240,130);couple(w,120,70,3.2)},500)}
  return true;
}
var drag=false;
function cellAt(e){var r=cv.getBoundingClientRect();return[Math.floor((e.clientY-r.top)/r.height*R),Math.floor((e.clientX-r.left)/r.width*C)]}
stage.addEventListener('pointerdown',function(e){var t=cellAt(e);if(Math.abs(t[0]-pos.r)<=3&&Math.abs(t[1]-pos.c)<=3){drag=true;stage.setPointerCapture(e.pointerId);follow(e)}});
stage.addEventListener('pointermove',function(e){if(drag)follow(e)});
['pointerup','pointercancel'].forEach(function(n){stage.addEventListener(n,function(){drag=false})});
function follow(e){var t=cellAt(e);for(var i=0;i<4;i++){var a=t[0]-pos.r,c=t[1]-pos.c;if(!a&&!c)break;
  var vert=Math.abs(a)>=Math.abs(c),d1=vert?(a<0?0:2):(c>0?1:3),d2=vert?(c>0?1:3):(a<0?0:2),ok=move(d1);
  if(!ok&&(vert?c:a))ok=move(d2);if(!ok)break}}
document.addEventListener('keydown',function(e){var m={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3}[e.key];
  if(m===undefined||e.metaKey||e.ctrlKey||e.altKey||e.target.tagName=='BUTTON')return;e.preventDefault();move(m)});
$('hint').onclick=function(){var p=solve(),k=pos.r/B|0,t='';
  if(p.length>1){var d=['up','right','down','left'][[0,1,2,3].filter(function(d){return pos.r+dr[d]==p[1][0]&&pos.c+dc[d]==p[1][1]})[0]];t=' Try going '+d+'.'}
  say(TIP[k]+t)};
$('route').onclick=function(){routeOn=!routeOn;this.textContent=routeOn?'Hide route':'Show route'};
$('new').onclick=gen;$('again').onclick=gen;
function frame(now){
  vx+=(pos.c*N+N/2-vx)*.3;vy+=(pos.r*N+N/2-vy)*.3;
  ctx.setTransform(S,0,0,S,0,0);ctx.clearRect(0,0,W,H);ctx.drawImage(bg,0,0,W,H);
  if(routeOn&&!done){var p=solve();ctx.lineCap='round';ctx.lineJoin='round';
    [['rgba(255,255,255,.9)',9,[]],['#c21f34',4,[8,8]]].forEach(function(s){ctx.strokeStyle=s[0];ctx.lineWidth=s[1];ctx.setLineDash(s[2]);ctx.beginPath();
      p.forEach(function(q,i){var x=q[1]*N+N/2,y=q[0]*N+N/2;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});ctx.setLineDash([])}
  var pu=(Math.sin(now/300)+1)/2;ctx.strokeStyle='rgba(194,31,52,'+(.8-.5*pu)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(end[1]*N+N/2,end[0]*N+N/2,16+8*pu,0,6.3);ctx.stroke();
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=6;couple(ctx,vx,vy+1,.9);ctx.shadowBlur=0;
  requestAnimationFrame(frame);
}
gen();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
