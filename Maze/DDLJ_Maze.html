<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Help Raj &amp; Simran find their way to Punjab</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5e9dd;--ink:#34370f;--olive:#8a9a39;--gold:#f3b31f;--red:#c21f34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b12;--ink:#f4ead8}}
:root[data-theme="dark"]{--bg:#1c1b12;--ink:#f4ead8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:500;line-height:1.25;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:6px 8px 0;display:flex;flex-direction:column;align-items:center}
.stage{position:relative;width:min(100%,560px);border-radius:22px;overflow:hidden;background:#f5e9dd;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.stage:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sub{margin:10px 0 0;text-align:center;font-weight:700;letter-spacing:.09em;color:#5d8a2c;font-size:clamp(.85rem,3vw,1.05rem);text-transform:uppercase}
h1{margin:0 0 10px;text-align:center;font-size:clamp(2.4rem,11vw,3.8rem);line-height:1;font-weight:700;background:linear-gradient(#5f7fd0,#2c3f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{position:sticky;bottom:0;z-index:5;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid rgba(138,154,57,.45)}
#msg{margin:0;text-align:center;font-size:1rem;min-height:1.3em}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);background:transparent;border:2px solid var(--olive);border-radius:99px;padding:4px 14px;min-height:42px;cursor:pointer}
button.p,.card button{background:var(--gold);border-color:var(--gold);color:#33340f}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:20;max-width:min(92%,430px);padding:9px 20px 10px;text-align:center;border:3px solid #fff8ee;border-radius:18px;box-shadow:0 8px 22px rgba(0,0,0,.35);pointer-events:none;background:var(--gold);color:#33340f;font-weight:700;font-size:clamp(1rem,3.8vw,1.2rem)}
.toast.bad{background:var(--red);color:#fff8ee}
.toast strong{display:block;font-size:1.25em;line-height:1.1}
.toast[hidden],.win[hidden]{display:none}
.win{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(245,233,221,.82)}
.card{width:min(100%,380px);padding:14px 20px 20px;text-align:center;background:#fff8ee;color:#34370f;border:3px solid #8a9a39;border-radius:20px;box-shadow:0 10px 30px rgba(52,55,15,.28)}
.card h2{margin:0 0 4px;color:#3f5fae;font-size:1.5rem;line-height:1.15}
.card p{margin:0 0 12px}
</style>
</head>
<body>
<main class="wrap">
  <p class="sub">Help us find our way to Punjab!</p>
  <h1>Raj &amp; Simran</h1>
  <div class="stage" id="stage" tabindex="0" role="application" aria-label="Maze map. Drag the heart, or use the arrow keys, along the golden path from the couple at the bottom, through Switzerland and the UK, to the haveli in Punjab at the top.">
    <canvas id="bgc"></canvas><canvas id="trc"></canvas><canvas id="fx"></canvas>
  </div>
  <div class="bar" id="bar">
    <p id="msg" role="status" aria-live="polite">Drawing the map…</p>
    <div class="btns"><button id="hint" class="p">Hint</button><button id="route">Show the route</button><button id="reset">Start over</button><button id="newm">New maze</button></div>
  </div>
</main>
<div class="toast" id="toast" role="alert" hidden></div>
<div class="win" id="win" hidden role="dialog" aria-labelledby="wt"><div class="card"><canvas id="wc" width="260" height="130"></canvas><h2 id="wt">Raj &amp; Simran made it to Punjab!</h2><p>Past the cows and cowbells, by Big Ben and the London Eye, and across the ocean. Palat!</p><button id="again">Play again</button></div></div>
<script>
