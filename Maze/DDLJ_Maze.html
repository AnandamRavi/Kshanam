<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Help Raj &amp; Simran find their way to Punjab</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5e9dd;--ink:#34370f;--panel:#fff8ee;--red:#c21f34;--gold:#f3b31f;--olive:#8a9a39;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b12;--ink:#f4ead8}}
:root[data-theme="dark"]{--bg:#1c1b12;--ink:#f4ead8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:500;line-height:1.25}
.wrap{max-width:1100px;margin:0 auto;padding:10px 10px 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.frame{position:relative;width:100%}
.scroller{overflow-x:auto;border-radius:20px;scrollbar-width:none;background:#f5e9dd}
.scroller::-webkit-scrollbar{display:none}
.stage{width:max(100%,900px);aspect-ratio:1560/640;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stage:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
canvas#cv{width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:90%;padding:8px 18px;text-align:center;background:var(--red);color:#fff8ee;border:3px solid #fff8ee;border-radius:16px;font-weight:700;font-size:clamp(.95rem,3.4vw,1.2rem);pointer-events:none;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast[hidden],.win[hidden]{display:none}
.win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;background:rgba(245,233,221,.85);border-radius:20px}
.card{width:min(88%,400px);padding:16px 20px 20px;text-align:center;background:#fff8ee;color:#34370f;border:3px solid #8a9a39;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{margin:0 0 4px;color:#3f5fae;font-size:1.5rem;line-height:1.1}
.card p{margin:0 0 10px}
.sub{margin:6px 0 0;text-align:center;font-weight:700;letter-spacing:.09em;color:#5d8a2c;font-size:clamp(.8rem,2.6vw,1.1rem);text-transform:uppercase}
h1{margin:0;text-align:center;font-size:clamp(2.2rem,8vw,4.2rem);line-height:1;font-weight:700;background:linear-gradient(#5f7fd0,#2c3f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chips span{padding:0 12px;border:2px solid var(--olive);border-radius:99px;font-size:.9rem;opacity:.5}
.chips span.on{opacity:1;background:var(--gold);border-color:var(--gold);color:#33340f;font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px}
button{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:2px solid var(--olive);border-radius:99px;padding:5px 16px;min-height:42px;cursor:pointer}
button.p,.card button{background:var(--gold);border-color:var(--gold);color:#33340f}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main class="wrap">
  <div class="frame">
    <div class="scroller" id="sc"><div class="stage" id="stage" tabindex="0" role="application" aria-label="Maze map. Drag the couple, or use the arrow keys, along the yellow path from Switzerland to the UK to Punjab."><canvas id="cv"></canvas></div></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="win" id="win" hidden><div class="card"><canvas id="wc" width="240" height="120"></canvas><h2>Raj &amp; Simran made it to Punjab!</h2><p>Past the cows and cowbells, by Big Ben and the London Eye, and across the ocean. Palat!</p><button id="again">Play again</button></div></div>
  </div>
  <p class="sub">Help us find our way to Punjab!</p>
  <h1>Raj &amp; Simran</h1>
  <div class="chips" id="chips"><span>Switzerland</span><span>UK</span><span>Punjab</span></div>
  <div class="btns"><button id="hint">Hint</button><button id="route">Show the route</button><button id="reset" class="p">Start over</button></div>
